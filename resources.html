        .res-search input:focus {

        }

            border-color: #6a8dff;
            color: #fff;
        }

            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));

</head>

                          '<button class="res-copy-btn" data-pwd="' + escapeHtml(r.pwd) + '">' +
                          '<i class="far fa-copy"></i> 复制</button>'
                        : '<span class="res-pwd" style="color:#bbb"><i class="fas fa-unlock"></i> 无需提取码</span>';

                    html +=
                        '<div class="res-card">' +
                            '<div class="res-card-head">' +
                                '<div class="res-card-icon" style="background:' + cat.color + '">' +
                                    '<i class="fas ' + cat.icon + '"></i></div>' +
                                '<h3 class="res-card-title">' + escapeHtml(r.title) + '</h3>' +
                            '</div>' +
                            (r.desc ? '<p class="res-card-desc">' + escapeHtml(r.desc) + '</p>' : '') +
                            '<div class="res-card-meta">' +
                                '<span class="res-tag disk" style="background:' + disk.color + '">' +
                                    '<i class="fas ' + disk.icon + '"></i> ' + escapeHtml(disk.name) + '</span>' +
                                '<span class="res-tag cat"><i class="fas ' + cat.icon + '"></i> ' +
                                    escapeHtml(cat.name) + '</span>' +
                                (r.size ? '<span class="res-tag size"><i class="fas fa-database"></i> ' +
                                    escapeHtml(r.size) + '</span>' : '') +
                                (r.date ? '<span class="res-tag date"><i class="far fa-calendar"></i> ' +
                                    escapeHtml(r.date) + '</span>' : '') +
                            '</div>' +
                            '<div class="res-card-foot">' +
                                pwdHtml +
                                '<a class="res-go" href="' + escapeHtml(r.url) + '" target="_blank" rel="noopener">' +
                                    '前往网盘 <i class="fas fa-arrow-right"></i></a>' +
                            '</div>' +
                        '</div>';
                });
                grid.innerHTML = html;
            }

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(function () { toast.classList.remove('show'); }, 1600);
            }

            /* 分类点击 */
            catsBox.addEventListener('click', function (e) {
                var target = e.target.closest('.res-cat');
                if (!target) return;
                var cats = catsBox.querySelectorAll('.res-cat');
                cats.forEach(function (c) { c.classList.remove('active'); });
                target.classList.add('active');
                activeCat = target.getAttribute('data-cat');
                render();
            });

            /* 搜索 */
            searchInput.addEventListener('input', function () {
                keyword = this.value;
                render();
            });

            /* 复制提取码 */
            grid.addEventListener('click', function (e) {
                var btn = e.target.closest('.res-copy-btn');
                if (!btn) return;
                var pwd = btn.getAttribute('data-pwd');
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(pwd).then(function () {
                        btn.classList.add('copied');
                        btn.innerHTML = '<i class="fas fa-check"></i> 已复制';
                        showToast('提取码已复制：' + pwd);
                        setTimeout(function () {
                            btn.classList.remove('copied');
                            btn.innerHTML = '<i class="far fa-copy"></i> 复制';
                        }, 1500);
                    });
                } else {
                    // 兜底方案
                    var ta = document.createElement('textarea');
                    ta.value = pwd;
                    document.body.appendChild(ta);
                    ta.select();
                    try { document.execCommand('copy'); } catch (err) {}
                    document.body.removeChild(ta);
                    showToast('提取码已复制：' + pwd);
                }
            });

            renderCats();
            render();
        })();
    </script>
</body>
</html>
